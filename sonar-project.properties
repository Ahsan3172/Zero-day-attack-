sonar.projectKey=Ahsan3172_Zero-day-attack-
sonar.organization=ahsan3172
sonar.projectName=Zero Day Attack Detection System
sonar.projectVersion=1.0.0

# Source code
sonar.sources=frontend/src,backend,api
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts,**/coverage/**,**/__tests__/**,**/tests/**

# Test coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.python.coverage.reportPaths=api/coverage.xml

# Language specific settings
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx
sonar.python.file.suffixes=.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gates
sonar.qualitygate.wait=true