name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.10'

jobs:
  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type checking
      run: npm run type-check
    
    - name: Linting
      run: npm run lint
    
    - name: Unit Tests
      run: npm run test:coverage
    
    - name: Build
      run: npm run build
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
    
    - name: Install Playwright
      run: npx playwright install --with-deps
    
    - name: E2E Tests
      run: npm run test:e2e
      env:
        CI: true
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Linting
      run: npm run lint
    
    - name: Security Audit
      run: npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Unit Tests
      run: npm run test:coverage
      env:
        DB_HOST: localhost
        DB_PORT: 3306
        DB_NAME: testdb
        DB_USER: root
        DB_PASSWORD: testpassword
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test
    
    - name: Integration Tests
      run: npm run test:integration
      env:
        DB_HOST: localhost
        DB_PORT: 3306
        DB_NAME: testdb
        DB_USER: root
        DB_PASSWORD: testpassword
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  # API Tests
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install bandit safety mypy black isort flake8
    
    - name: Code formatting check
      run: |
        black --check .
        isort --check-only .
    
    - name: Linting
      run: |
        flake8 .
        mypy . --ignore-missing-imports
    
    - name: Security checks
      run: |
        bandit -r . -x tests/
        safety check
      continue-on-error: true
    
    - name: Unit Tests
      run: pytest tests/test_models.py tests/test_utils.py -v --cov=. --cov-report=xml
    
    - name: Integration Tests
      run: pytest tests/test_api.py -v --cov=. --cov-report=xml --cov-append
    
    - name: Performance Tests
      run: pytest -m performance -v --benchmark-only
      continue-on-error: true
    
    - name: Security Tests
      run: pytest -m security -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./api/coverage.xml
        flags: api
        name: api-coverage

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'http://localhost:8000'
      continue-on-error: true

  # Load Testing
  load-testing:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
    
    - name: Create load test script
      run: |
        cat > load-test.js << EOF
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          vus: 10,
          duration: '30s',
        };

        export default function () {
          let response = http.get('http://localhost:8000/health');
          check(response, { 'status was 200': (r) => r.status == 200 });
          sleep(1);
        }
        EOF
    
    - name: Run load tests
      run: k6 run load-test.js
      continue-on-error: true

  # Accessibility Testing
  accessibility-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build app
      run: npm run build
    
    - name: Install serve
      run: npm install -g serve
    
    - name: Start server
      run: serve -s dist -l 3000 &
      
    - name: Wait for server
      run: sleep 10
    
    - name: Install axe-core-cli
      run: npm install -g @axe-core/cli
    
    - name: Run accessibility tests
      run: axe http://localhost:3000 --exit
      continue-on-error: true

  # Build and Deploy (on main branch)
  deploy:
    needs: [frontend-tests, backend-tests, api-tests, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
    
    - name: Build Backend
      run: |
        cd backend
        npm ci
    
    - name: Prepare API
      run: |
        cd api
        pip install -r requirements.txt
    
    - name: Create deployment artifact
      run: |
        tar -czf deployment.tar.gz frontend/dist backend api
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: deployment.tar.gz
        retention-days: 30

  # Dependency Audit
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Frontend Dependency Audit
      run: |
        cd frontend
        npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Backend Dependency Audit
      run: |
        cd backend
        npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Python Security Check
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install safety
      run: pip install safety
    
    - name: API Security Audit
      run: |
        cd api
        safety check -r requirements.txt
      continue-on-error: true

  # Code Quality
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true