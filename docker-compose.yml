version: '3.8'

services:
  # Database
  mysql:
    image: mysql:8.0
    container_name: zda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zero_day_db
      MYSQL_USER: zda_user
      MYSQL_PASSWORD: zda_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - zda-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: zda-redis
    ports:
      - "6379:6379"
    networks:
      - zda-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: zda-api
    environment:
      - DATABASE_URL=mysql://zda_user:zda_password@mysql:3306/zero_day_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./api/uploads:/app/uploads
      - ./api/models:/app/models
      - ./api/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zda-network
    restart: unless-stopped

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zda-backend
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=zero_day_db
      - DB_USER=zda_user
      - DB_PASSWORD=zda_password
      - JWT_SECRET=your-jwt-secret-here
      - ML_API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - zda-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zda-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - zda-network
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: zda-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - zda-network

  # Monitoring with Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: zda-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - zda-network

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  zda-network:
    driver: bridge